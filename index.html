<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Radio Tuner</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent-green: #2ecc71;
            --accent-red: #ff4757;
            --accent-purple: #9b59b6;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            padding: 20px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 50;
            border-bottom: 1px solid #222;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        input[type="text"] {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #333;
            color: white;
            font-size: 0.9rem;
            outline: none;
            min-width: 180px;
            flex: 1;
            max-width: 300px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--text-sub);
        }

        select {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #333;
            color: white;
            font-size: 0.9rem;
            outline: none;
            min-width: 160px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right .8em top 50%;
            background-size: .65em auto;
            padding-right: 30px;
            transition: border-color 0.3s;
        }

        button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        .btn-find { background-color: var(--accent-green); color: #000; }
        .btn-fav { background-color: var(--accent-red); }
        .btn-wheel { background-color: var(--accent-purple); }
        .btn-fav.active { border: 2px solid white; box-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }

        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            align-content: start;
        }

        .station-card {
            background-color: var(--card-bg);
            padding: 20px 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid #222;
            animation: fadeUp 0.4s ease-out backwards;
            cursor: pointer;
        }

        .station-card:hover {
            background-color: #252525;
            transform: translateY(-2px);
        }

        /* Keyboard focus style for accessibility */
        .station-card:focus {
            outline: 2px solid var(--accent-green);
            outline-offset: 2px;
        }

        .fav-icon {
            position: absolute; top: 10px; right: 10px; font-size: 1.2rem;
            color: #444; cursor: pointer; z-index: 10; transition: color 0.2s, transform 0.2s;
        }
        .fav-icon:hover { color: white; }
        .fav-icon.is-saved { color: var(--accent-red); }
        .fav-icon:active { transform: scale(1.3); }

        .station-img {
            width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
            background: #333; margin-bottom: 15px; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s ease;
        }
        .station-card:hover .station-img { transform: scale(1.05); }

        .station-name {
            font-weight: bold; font-size: 0.95rem; margin-bottom: 5px; color: white;
            line-height: 1.2; overflow: hidden; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; pointer-events: none;
        }

        .station-tags {
            font-size: 0.75rem; color: var(--text-sub); pointer-events: none;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%;
        }

        .player-bar {
            background: #111; border-top: 1px solid #333;
            padding: 15px 15px 25px 15px; 
            display: flex; align-items: center; justify-content: space-between;
            transition: background-color 0.3s; flex-wrap: wrap; gap: 10px;
        }

        .player-info {
            width: 30%; min-width: 150px; overflow: hidden; white-space: nowrap;
        }

        .player-name-wrapper {
            display: flex; align-items: center; gap: 15px;
        }

        #visualizerCanvas {
            width: 120px;
            height: 24px;
            display: none;
        }

        #visualizerCanvas.active {
            display: block;
        }

        .player-status {
            font-size: 0.85rem; color: var(--accent-green);
            display: flex; align-items: center; margin-top: 2px;
        }

        .custom-controls { display: flex; align-items: center; gap: 8px; margin-right: auto; }
        .mute-btn { background: none; border: none; font-size: 1.2rem; padding: 0; cursor: pointer; }
        .mute-btn:hover { opacity: 0.8; }
        input[type="range"] { accent-color: var(--accent-green); width: 80px; cursor: pointer; }

        .live-dot {
            display: inline-block; width: 8px; height: 8px; background: var(--accent-green);
            border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite;
        }

        .connecting-spinner {
            display: inline-block; width: 10px; height: 10px; border: 2px solid #555;
            border-top-color: var(--accent-green); border-radius: 50%; margin-right: 6px;
            animation: spin 1s linear infinite;
        }

        #wheelModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        .wheel-wrapper { position: relative; width: 90vw; max-width: 380px; aspect-ratio: 1/1; margin-bottom: 20px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 30px rgba(255, 255, 255, 0.05); }

        .wheel-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 20px solid transparent;
            border-right: 20px solid transparent; border-top: 40px solid white; z-index: 10;
        }

        .spin-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; border-radius: 50%; background: white;
            border: 4px solid var(--accent-green); color: black; font-weight: 900;
            font-size: 1.2rem; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; transition: transform 0.1s;
        }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .close-wheel {
            margin-top: 20px; background: transparent; border: 1px solid white;
            color: white; padding: 10px 30px; border-radius: 20px; transition: background 0.2s, color 0.2s;
        }
        .close-wheel:hover { background: white; color: black; }
        .message-box { text-align: center; color: #888; margin-top: 50px; grid-column: 1 / -1; animation: fadeIn 0.5s ease; }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes npFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .now-playing-bar {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 4px;
            height: 22px;
            position: relative;
        }

        .now-playing-inner {
            display: inline-block;
            font-size: 0.75rem;
            color: var(--accent-green);
            animation: npFadeIn 0.4s ease;
        }

        .now-playing-inner.scrolling {
            animation: marquee 18s linear infinite;
            padding-right: 60px; /* gap between loop repetitions */
        }

        .np-label {
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 5px;
        }
    </style>
</head>
<body>
<header>
    <h1>📻 Global Radio Tuner</h1>
    <div class="controls-row">
        <input type="text" id="searchInput" placeholder="Search Station Name..." onkeyup="if(event.key === 'Enter') startSearch()">

        <select id="countrySelect"><option value="">Select Country (Any)</option></select>
        <select id="genreSelect">
            <option value="">Select Genre (Any)</option>
            <option value="pop">Pop</option><option value="rock">Rock</option><option value="jazz">Jazz</option>
            <option value="classical">Classical</option><option value="electronic">Electronic</option>
            <option value="hip hop">Hip Hop</option><option value="news">News</option><option value="country">Country</option>
            <option value="lofi">Lo-Fi</option><option value="80s">80s</option><option value="90s">90s</option>
            <option value="talk">Talk</option><option value="metal">Metal</option>
        </select>

        <button class="btn-find" onclick="startSearch()">Find Stations</button>
        <button id="btnFav" class="btn-fav" onclick="toggleViewFavorites()">❤️ My Favorites</button>
        <button class="btn-wheel" onclick="openWheel()">🎡 Surprise Me</button>
    </div>
</header>

<main id="stationGrid" role="list" aria-label="Station list">
    <div class="message-box">Connecting to Global Radio Network...</div>
</main>

<div class="player-bar">
    <div class="player-info" aria-live="polite">
        <div class="player-name-wrapper">
            <div style="font-weight:bold" id="pName">Select Station</div>
            <canvas id="visualizerCanvas" width="120" height="24" aria-hidden="true"></canvas>
        </div>
        <div class="player-status" id="pStatus">Ready</div>
        <div class="now-playing-bar" id="nowPlayingBar" style="display:none" aria-live="polite" aria-label="Now playing">
            <span class="now-playing-inner" id="nowPlayingInner"></span>
        </div>
    </div>

    <div class="custom-controls">
        <button id="muteBtn" class="mute-btn" onclick="toggleMute()" aria-label="Toggle mute">🔊</button>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1"
               oninput="changeVolume(this.value)" aria-label="Volume">
    </div>

    <div style="display: none;">
        <audio id="audioPlayerCORS" crossorigin="anonymous" playsinline></audio>
        <audio id="audioFallback" playsinline></audio>
    </div>
</div>

<div id="wheelModal" role="dialog" aria-modal="true" aria-label="Spin the wheel">
    <h2 style="color:white; margin-bottom:20px;">Spin the Wheel!</h2>
    <div class="wheel-wrapper">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
    </div>
    <button class="close-wheel" onclick="closeWheel()">Close</button>
</div>

<script>
 
    const MIRRORS = [
        "https://de1.api.radio-browser.info/json",
        "https://nl1.api.radio-browser.info/json",
        "https://at1.api.radio-browser.info/json"
    ];

    let mirrorIdx = 0;
    let currentStations = [];
    let isViewingFavs = false;
    let isSpinning = false;
    let currentHls = null;
    let searchController = null; 
    let searchDebounceTimer = null;


    let metaPollInterval    = null;
    let metaFetchController = null;
    let currentStreamUrl    = '';
    let currentStation      = null;
    let lastTrackTitle      = '';

    const stationMap = new Map();

    let favouriteSet = new Set();
    let favouriteList = [];


    const audioCORS     = document.getElementById('audioPlayerCORS');
    const audioFallback = document.getElementById('audioFallback');
    let activeAudio     = audioCORS;

    const muteBtn  = document.getElementById('muteBtn');
    const volSlider = document.getElementById('volSlider');

    const vizCanvas = document.getElementById('visualizerCanvas');
    const vizCtx    = vizCanvas.getContext('2d');
    const numBars   = 24;
    let rafId       = null;
    let vizRunning  = false;

    let audioCtx         = null;
    let analyser         = null;
    let dataArray        = null;
    let isAudioCtxSetup  = false;
    let useRealVisualizer = true;
    let time             = 0;

    function esc(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    const storage = {
        _mem: {},
        get(key) {
            try { return localStorage.getItem(key); }
            catch { return this._mem[key] ?? null; }
        },
        set(key, value) {
            try { localStorage.setItem(key, value); }
            catch { this._mem[key] = value; }
        }
    };

    window.addEventListener('load', async () => {
        loadFavourites();
        restoreVolume();
        await loadCountries();
        startSearch();
        setupAudioListeners();
        startVisualizer();
        setupKeyboardNav();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopVisualizer();
        } else {
            startVisualizer();
        }
    });

    window.addEventListener('pagehide', () => {
        stopMetadataPolling();
        if (audioCtx) audioCtx.close();
    });

    function loadFavourites() {
        const saved = storage.get('radio_favs_v2');
        if (saved) {
            try {
                favouriteList = JSON.parse(saved);
                favouriteSet  = new Set(favouriteList.map(s => s.stationuuid));
            } catch { favouriteList = []; favouriteSet = new Set(); }
        }
    }

    function saveFavourites() {
        storage.set('radio_favs_v2', JSON.stringify(favouriteList));
    }

    document.getElementById('stationGrid').addEventListener('click', e => {
        const favBtn = e.target.closest('.fav-icon');
        const card   = e.target.closest('.station-card');

        if (favBtn) {
            e.stopPropagation();
            const uuid    = favBtn.dataset.uuid;
            const station = stationMap.get(uuid);
            if (!station) return;

            if (favouriteSet.has(uuid)) {
                favouriteSet.delete(uuid);
                favouriteList = favouriteList.filter(s => s.stationuuid !== uuid);
                favBtn.classList.remove('is-saved');
                if (isViewingFavs) {
                    currentStations = [...favouriteList];
                    renderGrid(currentStations);
                }
            } else {
                favouriteSet.add(uuid);
                favouriteList.push(station);
                favBtn.classList.add('is-saved');
            }
            saveFavourites();
            return;
        }

        if (card) {
            const uuid    = card.dataset.uuid;
            const station = stationMap.get(uuid);
            if (station) playStation(station);
        }
    });

    function setupKeyboardNav() {
        document.getElementById('stationGrid').addEventListener('keydown', e => {
            const cards = [...document.querySelectorAll('.station-card')];
            const idx   = cards.indexOf(document.activeElement);
            if (idx === -1) return;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                cards[Math.min(idx + 1, cards.length - 1)]?.focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                cards[Math.max(idx - 1, 0)]?.focus();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                const uuid = document.activeElement.dataset.uuid;
                const station = stationMap.get(uuid);
                if (station) playStation(station);
            }
        });
    }

    async function loadCountries() {
        try {
            const resp = await fetch(
                `${MIRRORS[mirrorIdx]}/countries?order=stationcount&reverse=true&limit=100`
            );
            if (!resp.ok) throw new Error('Countries fetch failed');
            const data   = await resp.json();
            const select = document.getElementById('countrySelect');
            data.forEach(c => {
                const opt    = document.createElement('option');
                opt.value    = esc(c.iso_3166_1);
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        } catch { /* non-fatal */ }
    }

    function toggleViewFavorites() {
        isViewingFavs = !isViewingFavs;
        const btn     = document.getElementById('btnFav');
        if (isViewingFavs) {
            btn.classList.add('active');
            btn.textContent = 'Back to Search';
            currentStations = [...favouriteList];
            renderGrid(currentStations);
        } else {
            btn.classList.remove('active');
            btn.textContent = '❤️ My Favorites';
            startSearch();
        }
    }

    function startSearch() {
        if (isViewingFavs) toggleViewFavorites();

        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(_executeSearch, 300);
    }

    async function _executeSearch() {
        if (searchController) searchController.abort();
        searchController = new AbortController();

        const grid = document.getElementById('stationGrid');
        grid.innerHTML = '<div class="message-box"><span class="connecting-spinner"></span> Scanning frequencies...</div>';

        const term    = document.getElementById('searchInput').value.trim();
        const country = document.getElementById('countrySelect').value;
        const genre   = document.getElementById('genreSelect').value;

        let url = `${MIRRORS[mirrorIdx]}/stations/search?limit=60&hidebroken=true&order=clickcount&reverse=true`;
        if (term)    url += `&name=${encodeURIComponent(term)}`;
        if (country) url += `&countrycode=${encodeURIComponent(country)}`;
        if (genre)   url += `&tag=${encodeURIComponent(genre)}`;

        try {
            const resp = await fetch(url, { signal: searchController.signal });
            if (!resp.ok) throw new Error('API error');
            const data = await resp.json();

            if (!Array.isArray(data)) throw new Error('Unexpected response shape');

            currentStations = data;

            stationMap.clear();
            data.forEach(s => stationMap.set(s.stationuuid, s));
            renderGrid(currentStations);
        } catch (err) {
            if (err.name === 'AbortError') return;
            mirrorIdx++;
            if (mirrorIdx < MIRRORS.length) {
                _executeSearch();
            } else {
                grid.innerHTML = '<div class="message-box">All servers busy. Please refresh.</div>';
            }
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('stationGrid');
        grid.innerHTML = '';

        if (!data || data.length === 0) {
            grid.innerHTML = '<div class="message-box">No stations found.<br>Try adjusting filters.</div>';
            return;
        }

        const frag = document.createDocumentFragment();

        data.forEach(s => stationMap.set(s.stationuuid, s));

        data.forEach((s, index) => {
            const isFav    = favouriteSet.has(s.stationuuid);
            const heartCls = isFav ? 'is-saved' : '';

            let faviconSrc = '';
            try {
                const u = new URL(s.favicon || '');
                if (u.protocol === 'http:' || u.protocol === 'https:') {
                    faviconSrc = u.href;
                }
            } catch { /* invalid URL, leave empty — onerror fallback handles it */ }

            const div = document.createElement('div');
            div.className   = 'station-card';
            div.style.animationDelay = `${(index % 20) * 0.04}s`;
            div.dataset.uuid = s.stationuuid;
            div.setAttribute('role', 'listitem');
            div.setAttribute('tabindex', '0');
            div.setAttribute('aria-label', s.name);
            const favBtn = document.createElement('div');
            favBtn.className     = `fav-icon ${heartCls}`;
            favBtn.dataset.uuid  = s.stationuuid;
            favBtn.textContent   = '❤';
            favBtn.setAttribute('role', 'button');
            favBtn.setAttribute('aria-label', isFav ? 'Remove from favourites' : 'Add to favourites');
            favBtn.setAttribute('aria-pressed', String(isFav));
            favBtn.setAttribute('tabindex', '-1');

            const img = document.createElement('img');
            img.src     = faviconSrc || 'https://cdn-icons-png.flaticon.com/512/565/565296.png';
            img.className = 'station-img';
            img.alt       = '';
            img.loading   = 'lazy';
            img.onerror   = () => { img.src = 'https://cdn-icons-png.flaticon.com/512/565/565296.png'; };

            const name = document.createElement('div');
            name.className   = 'station-name';
            name.textContent = s.name;

            const tags = document.createElement('div');
            tags.className   = 'station-tags';
            tags.textContent = s.tags || 'Radio';

            div.append(favBtn, img, name, tags);
            frag.appendChild(div);
        });

        grid.appendChild(frag);
    }

    function restoreVolume() {
        const saved = parseFloat(storage.get('radio_volume') ?? '1');
        const vol   = isNaN(saved) ? 1 : Math.min(1, Math.max(0, saved));
        audioCORS.volume     = vol;
        audioFallback.volume = vol;
        volSlider.value      = vol;
    }

    function toggleMute() {
        const muted          = !audioCORS.muted;
        audioCORS.muted      = muted;
        audioFallback.muted  = muted;
        updateVolumeUI();
    }

    function changeVolume(val) {
        const v              = parseFloat(val);
        audioCORS.volume     = v;
        audioFallback.volume = v;
        if (v > 0) {
            audioCORS.muted      = false;
            audioFallback.muted  = false;
        }
        storage.set('radio_volume', String(v));
        updateVolumeUI();
    }

    function updateVolumeUI() {
        if (activeAudio.muted || activeAudio.volume === 0) {
            muteBtn.textContent = '🔇';
            if (activeAudio.volume === 0) volSlider.value = 0;
        } else {
            muteBtn.textContent = activeAudio.volume < 0.5 ? '🔈' : '🔊';
            volSlider.value     = activeAudio.volume;
        }
    }

    function initTrueVisualizer() {
        if (isAudioCtxSetup) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx  = new AudioContext();
        analyser  = audioCtx.createAnalyser();

        const source = audioCtx.createMediaElementSource(audioCORS);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        analyser.fftSize = 64;
        dataArray        = new Uint8Array(analyser.frequencyBinCount);
        isAudioCtxSetup  = true;
    }

    function startVisualizer() {
        if (vizRunning) return;
        vizRunning = true;
        _vizLoop();
    }

    function stopVisualizer() {
        vizRunning = false;
        if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
        }
    }

    function _vizLoop() {
        if (!vizRunning) return;
        drawVisualizer();
        rafId = requestAnimationFrame(_vizLoop);
    }

    function drawVisualizer() {
        vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);

        if (!activeAudio.paused && !activeAudio.muted && activeAudio.volume > 0) {
            const barWidth = vizCanvas.width / numBars;
            const gap      = 1;

            if (useRealVisualizer && isAudioCtxSetup) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < numBars; i++) {
                    const percent = dataArray[i] / 255;
                    const h       = Math.max(1, percent * vizCanvas.height);
                    vizCtx.fillStyle = '#2ecc71';
                    vizCtx.fillRect(i * barWidth, vizCanvas.height - h, barWidth - gap, h);
                }
            } else {
                time += 0.15;
                for (let i = 0; i < numBars; i++) {
                    const wave1     = Math.sin(time + i * 0.5);
                    const wave2     = Math.cos(time * 0.8 - i * 0.2);
                    const heightMod = Math.abs(wave1 * wave2);
                    const bassBias  = 1 - (i / numBars) * 0.5;
                    const h         = Math.max(1, heightMod * vizCanvas.height * bassBias * activeAudio.volume);
                    vizCtx.fillStyle = '#2ecc71';
                    vizCtx.fillRect(i * barWidth, vizCanvas.height - h, barWidth - gap, h);
                }
            }
        }
    }

    function setupAudioListeners() {
        const statusEl = document.getElementById('pStatus');

        function bindEvents(audioEl) {
            audioEl.addEventListener('playing', () => {
                if (audioEl === audioCORS) {
                    if (!isAudioCtxSetup) initTrueVisualizer();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                }
                statusEl.innerHTML     = '<span class="live-dot"></span>Live';
                statusEl.style.color   = 'var(--accent-green)';
                vizCanvas.classList.add('active');
            });

            audioEl.addEventListener('pause', () => {
                statusEl.textContent  = 'Paused';
                statusEl.style.color  = 'var(--text-sub)';
                stopMetadataPolling();
            });

            audioEl.addEventListener('volumechange', updateVolumeUI);
        }

        bindEvents(audioCORS);
        bindEvents(audioFallback);
    }

    function startMetadataPolling(url) {
        stopMetadataPolling();
        clearNowPlaying();
        currentStreamUrl = url;

        _pollOnce(url);
        metaPollInterval = setInterval(() => _pollOnce(url), 20000);
    }

    function stopMetadataPolling() {
        if (metaPollInterval)    { clearInterval(metaPollInterval); metaPollInterval = null; }
        if (metaFetchController) { metaFetchController.abort(); metaFetchController = null; }
    }

    async function _pollOnce(url) {
        if (metaFetchController) metaFetchController.abort();
        metaFetchController = new AbortController();
        const signal = metaFetchController.signal;

        try {
            const resp = await fetch(url, {
                headers: { 'Icy-MetaData': '1' },
                signal
            });

            const metaint = parseInt(resp.headers.get('icy-metaint') || '0', 10);
            if (!metaint || !resp.body) {
                _tryStationDescription();
                return;
            }

            const reader = resp.body.getReader();
            const needed = metaint + 1 + 16 * 255;
            let chunks   = [];
            let total    = 0;

            while (total < needed) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                total += value.length;
            }
            reader.cancel();

            const buf     = new Uint8Array(total);
            let offset    = 0;
            for (const c of chunks) { buf.set(c, offset); offset += c.length; }

            if (buf.length <= metaint) return;

            const metaLen = buf[metaint] * 16;
            if (metaLen === 0) return;

            const end     = metaint + 1 + metaLen;
            if (buf.length < end) return;

            const metaStr = new TextDecoder('utf-8', { fatal: false })
                .decode(buf.slice(metaint + 1, end));

            const title = _parseStreamTitle(metaStr);
            if (title) updateNowPlaying(title);

        } catch (err) {
            if (err.name === 'AbortError') return;
            _tryStationDescription();
        }
    }

    function _parseStreamTitle(metaStr) {
        const m = metaStr.match(/StreamTitle\s*=\s*'([^']*)'/i);
        if (!m) return null;
        const raw = m[1].trim();
        if (!raw || raw === '-' || raw.length < 2) return null;

        const sep = raw.indexOf(' - ');
        if (sep > 0) {
            const artist = raw.slice(0, sep).trim();
            const track  = raw.slice(sep + 3).trim();
            if (artist && track) {
                return `<span class="np-label">Now playing</span>${_htmlEsc(track)}`
                     + `<span class="np-label" style="margin-left:8px">by</span>${_htmlEsc(artist)}`;
            }
        }
        return `<span class="np-label">Now playing</span>${_htmlEsc(raw)}`;
    }

    function _htmlEsc(str) {
        return String(str).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );
    }

    function _tryStationDescription() {
        if (!currentStation) return;
        const desc = currentStation.tags || currentStation.country || '';
        if (desc) updateNowPlaying(
            `<span class="np-label">Station</span>${_htmlEsc(desc)}`,
            /* isStatic */ true
        );
    }

    function updateNowPlaying(html, isStatic = false) {
        if (html === lastTrackTitle) return;
        lastTrackTitle = html;

        const bar   = document.getElementById('nowPlayingBar');
        const inner = document.getElementById('nowPlayingInner');

        inner.innerHTML = html;
        bar.style.display = 'block';

        inner.classList.remove('scrolling');
        requestAnimationFrame(() => {
            const barW   = bar.offsetWidth;
            const textW  = inner.scrollWidth;
            if (!isStatic && textW > barW) {
                inner.innerHTML = html + '<span style="padding:0 40px"></span>' + html;
                inner.classList.add('scrolling');
            }
        });
        _updateMediaSession(html);
    }

    function clearNowPlaying() {
        lastTrackTitle = '';
        document.getElementById('nowPlayingBar').style.display  = 'none';
        document.getElementById('nowPlayingInner').innerHTML     = '';
        document.getElementById('nowPlayingInner').classList.remove('scrolling');
    }

    function _updateMediaSession(htmlTitle) {
        if (!('mediaSession' in navigator) || !currentStation) return;
        const plain = htmlTitle.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
        navigator.mediaSession.metadata = new MediaMetadata({
            title:  plain || currentStation.name,
            artist: currentStation.name,
            album:  currentStation.country || '',
            artwork: currentStation.favicon
                ? [{ src: currentStation.favicon, sizes: '96x96' }]
                : []
        });
    }

    function destroyHls() {
        if (currentHls) {
            try { currentHls.destroy(); } catch { /* ignore */ }
            currentHls = null;
        }
    }

    function playStation(s) {
        const statusEl = document.getElementById('pStatus');

        currentStation = s;
        clearNowPlaying();
        stopMetadataPolling();

        document.getElementById('pName').textContent = s.name;
        statusEl.innerHTML   = '<span class="connecting-spinner"></span>Connecting...';
        statusEl.style.color = 'var(--text-sub)';
        vizCanvas.classList.remove('active');

        let streamUrl = s.url_resolved || s.url || '';
        if (window.location.protocol === 'https:' && streamUrl.startsWith('http:')) {
            try {
                const u  = new URL(streamUrl);
                u.protocol = 'https:';
                streamUrl  = u.href;
            } catch { /* malformed URL, leave as-is and let the stream attempt fail gracefully */ }
        }

        destroyHls();
        audioCORS.pause();
        audioCORS.src = '';
        audioFallback.pause();
        audioFallback.src = '';

        _reportClick(s.stationuuid);

        attemptStream(streamUrl, true);

        const onPlaying = () => {
            audioCORS.removeEventListener('playing', onPlaying);
            audioFallback.removeEventListener('playing', onPlaying);
            startMetadataPolling(streamUrl);
        };
        audioCORS.addEventListener('playing', onPlaying, { once: true });
        audioFallback.addEventListener('playing', onPlaying, { once: true });
    }

    function _reportClick(uuid) {
        if (!uuid) return;
        fetch(`${MIRRORS[mirrorIdx]}/url/${encodeURIComponent(uuid)}`).catch(() => {});
    }

    function attemptStream(url, corsAttempted) {
        const statusEl = document.getElementById('pStatus');

        if (corsAttempted) {
            activeAudio       = audioCORS;
            useRealVisualizer = true;
        } else {
            activeAudio       = audioFallback;
            useRealVisualizer = false;
        }

        function onStreamError() {
            if (corsAttempted) {
                attemptStream(url, false);
            } else {
                destroyHls();
                vizCanvas.classList.remove('active');
                statusEl.textContent = 'Stream Checking / Offline?';
                statusEl.style.color = 'var(--accent-red)';
            }
        }

        if (Hls.isSupported() && url.includes('.m3u8')) {
            destroyHls();
            currentHls = new Hls();

            currentHls.on(Hls.Events.ERROR, (_e, data) => {
                if (data.fatal) onStreamError();
            });

            currentHls.loadSource(url);
            currentHls.attachMedia(activeAudio);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => activeAudio.play().catch(() => {}));
        } else {
            activeAudio.src = url;
            activeAudio.load();

            const errHandler = () => {
                activeAudio.removeEventListener('error', errHandler);
                onStreamError();
            };
            activeAudio.addEventListener('error', errHandler, { once: true });

            activeAudio.play().catch(() => onStreamError());
        }
    }

    function openWheel() {
        if (currentStations.length < 2) {
            alert('Need at least 2 stations to spin!');
            return;
        }
        if (document.getElementById('wheelModal').style.display === 'flex') return;

        document.getElementById('wheelModal').style.display = 'flex';
        drawWheel();
    }

    function closeWheel() {
        document.getElementById('wheelModal').style.display = 'none';
    }

    function drawWheel() {
        const canvas = document.getElementById('wheelCanvas');
        const ctx    = canvas.getContext('2d');
        const colors = ['#2ecc71', '#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#e74c3c'];
        const slice  = currentStations.slice(0, 16);
        const arc    = (2 * Math.PI) / slice.length;

        ctx.clearRect(0, 0, 600, 600);
        ctx.save();
        ctx.translate(300, 300);
        ctx.font          = 'bold 24px Arial';
        ctx.textBaseline  = 'middle';
        ctx.textAlign     = 'center';

        for (let i = 0; i < slice.length; i++) {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 300, angle, angle + arc);
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle    = 'white';
            ctx.shadowColor  = 'black';
            ctx.shadowBlur   = 4;
            let text = slice[i].name;
            if (text.length > 15) text = text.substring(0, 14) + '…';
            ctx.fillText(text, 170, 0);
            ctx.restore();
        }

        ctx.restore();
    }

    function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;

        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;

        const canvas     = document.getElementById('wheelCanvas');
        const randomDeg  = Math.floor(2000 + Math.random() * 2000);
        canvas.style.transition = 'transform 4s cubic-bezier(0.25, 0.1, 0.25, 1)';
        canvas.style.transform  = `rotate(${randomDeg}deg)`;

        setTimeout(() => {
            isSpinning       = false;
            spinBtn.disabled = false;

            canvas.style.transition = 'none';
            canvas.style.transform  = `rotate(${randomDeg % 360}deg)`;

            const slice        = currentStations.slice(0, 16);
            const pointerAngle = (270 - (randomDeg % 360) + 360) % 360;
            const picked       = slice[Math.floor(pointerAngle / (360 / slice.length))];

            if (picked) playStation(picked);
            setTimeout(closeWheel, 1000);
        }, 4000);
    }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Radio Tuner</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent-green: #2ecc71;
            --accent-red: #ff4757;
            --accent-purple: #9b59b6;
            --accent-blue: #3498db;
        }
        
        .btn-export { background-color: #e67e22; }
        .btn-import { background-color: #16a085; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0; display: flex; flex-direction: column;
            height: 100vh; height: 100dvh; overflow: hidden;
        }

        header { padding: 20px; background-color: #000; display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 50; border-bottom: 1px solid #222; }
        h1 { margin: 0; font-size: 1.5rem; color: white; display: flex; align-items: center; gap: 10px; }

        .controls-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }

        input[type="text"], select {
            padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background-color: #333;
            color: white; font-size: 0.9rem; outline: none; transition: border-color 0.3s;
        }
        input[type="text"] { min-width: 180px; flex: 1; max-width: 300px; }
        input[type="text"]:focus { border-color: var(--text-sub); }
        select { min-width: 140px; cursor: pointer; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right .8em top 50%; background-size: .65em auto; padding-right: 30px; }

        button { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; color: white; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; display: flex; align-items: center; gap: 6px; }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        .btn-find { background-color: var(--accent-green); color: #000; }
        .btn-fav { background-color: var(--accent-red); }
        .btn-hist { background-color: var(--accent-blue); }
        .btn-wheel { background-color: var(--accent-purple); }
        .btn-fav.active, .btn-hist.active { border: 2px solid white; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }

        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; align-content: start; }
        .station-card { background-color: var(--card-bg); padding: 20px 15px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; transition: background 0.2s, transform 0.2s; border: 1px solid #222; animation: fadeUp 0.4s ease-out backwards; cursor: pointer; }
        .station-card:hover { background-color: #252525; transform: translateY(-2px); }
        .station-card:focus { outline: 2px solid var(--accent-green); outline-offset: 2px; }

        .fav-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; color: #444; cursor: pointer; z-index: 10; transition: color 0.2s, transform 0.2s; }
        .fav-icon:hover { color: white; }
        .fav-icon.is-saved { color: var(--accent-red); }
        .fav-icon:active { transform: scale(1.3); }

        .station-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background: #333; margin-bottom: 15px; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
        .station-card:hover .station-img { transform: scale(1.05); }

        .station-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 5px; color: white; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; pointer-events: none; }
        .station-tags { font-size: 0.75rem; color: var(--text-sub); pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; width: 100%; }
        .badge { background: #333; color: #aaa; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-top: 5px; pointer-events: none; }

        .player-bar { background: #111; border-top: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; transition: background-color 0.3s; z-index: 100;}
        .player-main-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        
        .player-info { width: 30%; min-width: 150px; overflow: hidden; white-space: nowrap; }
        .player-name-wrapper { display: flex; align-items: center; gap: 15px; }
        #visualizerCanvas { width: 220px; height: 24px; display: none; }
        #visualizerCanvas.active { display: block; }
        .player-status { font-size: 0.85rem; color: var(--accent-green); display: flex; align-items: center; margin-top: 2px; }

        .custom-controls { display: flex; align-items: center; gap: 12px; margin-right: auto; flex-wrap: wrap; }
        .icon-btn { background: none; border: none; font-size: 1.2rem; padding: 5px; cursor: pointer; color: white; border-radius: 50%; }
        .icon-btn:hover { background: #333; }
        
        input[type="range"] { accent-color: var(--accent-green); width: 80px; cursor: pointer; }
        .eq-panel { display: none; gap: 10px; align-items: center; background: #222; padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; }
        .eq-panel.active { display: flex; animation: fadeIn 0.3s; }
        .eq-slider-group { display: flex; align-items: center; gap: 5px; }
        .eq-slider-group input { width: 50px; }

        .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
        .connecting-spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid #555; border-top-color: var(--accent-green); border-radius: 50%; margin-right: 6px; animation: spin 1s linear infinite; }

        #wheelModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; animation: fadeIn 0.3s ease-out; }
        .wheel-wrapper { position: relative; width: 90vw; max-width: 380px; aspect-ratio: 1/1; margin-bottom: 20px; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 30px rgba(255, 255, 255, 0.05); }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid white; z-index: 10; }
        .spin-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; background: white; border: 4px solid var(--accent-green); color: black; font-weight: 900; font-size: 1.2rem; cursor: pointer; z-index: 20; box-shadow: 0 0 20px rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .close-wheel { margin-top: 20px; background: transparent; border: 1px solid white; color: white; padding: 10px 30px; border-radius: 20px; transition: background 0.2s, color 0.2s; }
        .close-wheel:hover { background: white; color: black; }
        .message-box { text-align: center; color: #888; margin-top: 50px; grid-column: 1 / -1; animation: fadeIn 0.5s ease; }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes npFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .now-playing-bar { width: 100%; overflow: hidden; white-space: nowrap; margin-top: 4px; height: 22px; position: relative; }
        .now-playing-inner { display: inline-block; font-size: 0.75rem; color: var(--accent-green); animation: npFadeIn 0.4s ease; }
        .now-playing-inner.scrolling { animation: marquee 18s linear infinite; padding-right: 60px; }
        .np-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 5px; }
    </style>
</head>
<body>
<header>
    <h1>📻 Global Radio Tuner</h1>
    <div class="controls-row">
        <input type="text" id="searchInput" placeholder="Search Station Name..." onkeyup="if(event.key === 'Enter') startSearch()">
        <select id="countrySelect"><option value="">Select Country (Any)</option></select>
        <select id="genreSelect">
            <option value="">Select Genre (Any)</option>
            <option value="pop">Pop</option><option value="rock">Rock</option><option value="jazz">Jazz</option>
            <option value="classical">Classical</option><option value="electronic">Electronic</option>
            <option value="news">News</option><option value="talk">Talk</option>
        </select>
        <button class="btn-find" onclick="startSearch()">Find</button>
        <button id="btnFav" class="btn-fav" onclick="toggleViewFavorites()">❤️ Favorites</button>
        <button id="btnHist" class="btn-hist" onclick="toggleViewHistory()">🕒 History</button>
        <button class="btn-export" onclick="exportFavorites()" title="Download your favorites">💾 Export</button>
        <button class="btn-import" onclick="document.getElementById('importFile').click()" title="Load favorites from file">📂 Import</button>
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importFavorites(event)">
        <button class="btn-wheel" onclick="openWheel()">🎡 Surprise Me</button>
    </div>
</header>

<main id="stationGrid" role="list" aria-label="Station list">
    <div class="message-box">Connecting to Global Radio Network...</div>
</main>

<div class="player-bar">
    <div class="player-main-row">
        <div class="player-info" aria-live="polite">
            <div class="player-name-wrapper">
                <div style="font-weight:bold" id="pName">Select Station</div>
                <span id="bitrateBadge" class="badge" style="display:none;"></span>
                <canvas id="visualizerCanvas" width="120" height="24" aria-hidden="true"></canvas>
            </div>
            <div class="player-status" id="pStatus">Ready</div>
            <div class="now-playing-bar" id="nowPlayingBar" style="display:none" aria-live="polite">
                <span class="now-playing-inner" id="nowPlayingInner"></span>
            </div>
        </div>

        <div class="custom-controls">
            <button id="muteBtn" class="icon-btn" onclick="toggleMute()" title="Mute">🔊</button>
            <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)" title="Volume">
            
            <button class="icon-btn" onclick="toggleEQ()" title="Equalizer">🎛️</button>
            
            <select id="sleepTimer" onchange="setSleepTimer(this.value)" title="Sleep Timer">
                <option value="0">💤 Timer Off</option>
                <option value="15">15 mins</option>
                <option value="30">30 mins</option>
                <option value="60">60 mins</option>
            </select>

            <button class="icon-btn" onclick="shareStation()" title="Share Station">📤</button>
            <button id="castBtn" class="icon-btn" onclick="requestCast()" title="Cast to Device">📺</button>
        </div>
    </div>
    
    <div class="eq-panel" id="eqPanel">
        <div class="eq-slider-group"><label>Bass</label><input type="range" id="eqBass" min="-15" max="15" step="1" value="0" oninput="updateEQ()"></div>
        <div class="eq-slider-group"><label>Mid</label><input type="range" id="eqMid" min="-15" max="15" step="1" value="0" oninput="updateEQ()"></div>
        <div class="eq-slider-group"><label>Treble</label><input type="range" id="eqTreble" min="-15" max="15" step="1" value="0" oninput="updateEQ()"></div>
    </div>

    <div style="display: none;">
        <audio id="audioPlayerCORS" crossorigin="anonymous" playsinline x-webkit-airplay="allow"></audio>
        <audio id="audioFallback" playsinline x-webkit-airplay="allow"></audio>
    </div>
</div>

<div id="wheelModal" role="dialog" aria-modal="true" aria-label="Spin the wheel">
    <h2 style="color:white; margin-bottom:20px;">Spin the Wheel!</h2>
    <div class="wheel-wrapper">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
    </div>
    <button class="close-wheel" onclick="closeWheel()">Close</button>
</div>

<script>
    const MIRRORS = ["https://de1.api.radio-browser.info/json", "https://nl1.api.radio-browser.info/json", "https://at1.api.radio-browser.info/json"];
    let mirrorIdx = 0;
    let currentStations = [];
    
    const VIEW_SEARCH = 0, VIEW_FAV = 1, VIEW_HIST = 2;
    let currentView = VIEW_SEARCH;
    
    let isSpinning = false;
    let currentHls = null;
    let searchController = null; 
    let searchDebounceTimer = null;

    let metaPollInterval = null;
    let metaFetchController = null;
    let currentStreamUrl = '';
    let currentStation = null;
    let lastTrackTitle = '';
    let sleepTimerTimeout = null;

    const stationMap = new Map();
    let favouriteSet = new Set();
    let favouriteList = [];
    let historyList = [];

    const audioCORS = document.getElementById('audioPlayerCORS');
    const audioFallback = document.getElementById('audioFallback');
    let activeAudio = audioCORS;

    let audioCtx = null, analyser = null, dataArray = null;
    let bassNode, midNode, trebleNode;
    let isAudioCtxSetup = false, useRealVisualizer = true, time = 0;
    let vizRunning = false, rafId = null;
    const vizCanvas = document.getElementById('visualizerCanvas');
    const vizCtx = vizCanvas.getContext('2d');
    const numBars = 24;

    function esc(str) { return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    const storage = {
        _mem: {},
        get(key) { try { return localStorage.getItem(key); } catch { return this._mem[key] ?? null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch { this._mem[key] = value; } }
    };

    window.addEventListener('load', async () => {
        loadData();
        restoreVolume();
        await loadCountries();
        const hashUuid = window.location.hash.substring(1);
        if (hashUuid) {
            playFromHash(hashUuid);
        } else {
            startSearch();
        }
        
        setupAudioListeners();
        startVisualizer();
        setupKeyboardNav();
        checkCastSupport();
    });

    document.addEventListener('visibilitychange', () => document.hidden ? stopVisualizer() : startVisualizer());

    function loadData() {
        try { 
            favouriteList = JSON.parse(storage.get('radio_favs_v2')) || []; 
            favouriteSet = new Set(favouriteList.map(s => s.stationuuid));
        } catch { favouriteList = []; }
        
        try {
            historyList = JSON.parse(storage.get('radio_history')) || [];
        } catch { historyList = []; }
    }

    function saveData() {
        storage.set('radio_favs_v2', JSON.stringify(favouriteList));
        storage.set('radio_history', JSON.stringify(historyList));
    }
    function exportFavorites() {
        if (favouriteList.length === 0) {
            alert("You don't have any favorites to export yet!");
            return;
        }

        const dataStr = JSON.stringify(favouriteList, null, 2);

        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = "radio_favorites.json";
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function importFavorites(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                
                if (!Array.isArray(importedData)) {
                    throw new Error("Invalid file format. Expected an array.");
                }

                let addedCount = 0;

                importedData.forEach(station => {
                    if (station && station.stationuuid && !favouriteSet.has(station.stationuuid)) {
                        favouriteSet.add(station.stationuuid);
                        favouriteList.push(station);
                        addedCount++;
                    }
                });

                if (addedCount > 0) {
                    saveData(); // Save the newly merged list to localStorage
                    
                    // If the user is currently looking at the favorites view, refresh the grid
                    if (currentView === VIEW_FAV) {
                        renderGrid(favouriteList);
                    }
                    alert(`Successfully imported ${addedCount} new favorite stations!`);
                } else {
                    alert("No new stations found to import. You might already have them saved.");
                }
            } catch (err) {
                alert("Error importing file. Please make sure it is a valid JSON favorites file.");
                console.error(err);
            }

            event.target.value = '';
        };
        
        reader.readAsText(file);
    }
    function addToHistory(station) {
        historyList = [station, ...historyList.filter(s => s.stationuuid !== station.stationuuid)].slice(0, 10);
        saveData();
    }

    document.getElementById('stationGrid').addEventListener('click', e => {
        const favBtn = e.target.closest('.fav-icon');
        const card = e.target.closest('.station-card');

        if (favBtn) {
            e.stopPropagation();
            const uuid = favBtn.dataset.uuid;
            const station = stationMap.get(uuid);
            if (!station) return;

            if (favouriteSet.has(uuid)) {
                favouriteSet.delete(uuid);
                favouriteList = favouriteList.filter(s => s.stationuuid !== uuid);
                favBtn.classList.remove('is-saved');
                if (currentView === VIEW_FAV) renderGrid(favouriteList);
            } else {
                favouriteSet.add(uuid);
                favouriteList.push(station);
                favBtn.classList.add('is-saved');
            }
            saveData();
            return;
        }

        if (card) {
            const uuid = card.dataset.uuid;
            const station = stationMap.get(uuid);
            if (station) playStation(station);
        }
    });

    function toggleViewFavorites() {
        if (currentView === VIEW_FAV) {
            currentView = VIEW_SEARCH;
            document.getElementById('btnFav').classList.remove('active');
            startSearch();
        } else {
            currentView = VIEW_FAV;
            document.getElementById('btnFav').classList.add('active');
            document.getElementById('btnHist').classList.remove('active');
            renderGrid(favouriteList);
        }
    }

    function toggleViewHistory() {
        if (currentView === VIEW_HIST) {
            currentView = VIEW_SEARCH;
            document.getElementById('btnHist').classList.remove('active');
            startSearch();
        } else {
            currentView = VIEW_HIST;
            document.getElementById('btnHist').classList.add('active');
            document.getElementById('btnFav').classList.remove('active');
            renderGrid(historyList);
        }
    }

    function startSearch() {
        if (currentView !== VIEW_SEARCH) {
            currentView = VIEW_SEARCH;
            document.getElementById('btnFav').classList.remove('active');
            document.getElementById('btnHist').classList.remove('active');
        }
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(_executeSearch, 300);
    }

    async function _executeSearch() {
        if (searchController) searchController.abort();
        searchController = new AbortController();
        const grid = document.getElementById('stationGrid');
        grid.innerHTML = '<div class="message-box"><span class="connecting-spinner"></span> Scanning frequencies...</div>';

        const term = document.getElementById('searchInput').value.trim();
        const country = document.getElementById('countrySelect').value;
        const genre = document.getElementById('genreSelect').value;

        let url = `${MIRRORS[mirrorIdx]}/stations/search?limit=60&hidebroken=true&order=clickcount&reverse=true`;
        if (term) url += `&name=${encodeURIComponent(term)}`;
        if (country) url += `&countrycode=${encodeURIComponent(country)}`;
        if (genre) url += `&tag=${encodeURIComponent(genre)}`;

        try {
            const resp = await fetch(url, { signal: searchController.signal });
            const data = await resp.json();
            currentStations = data;
            data.forEach(s => stationMap.set(s.stationuuid, s));
            renderGrid(currentStations);
        } catch (err) {
            if (err.name !== 'AbortError') { mirrorIdx = (mirrorIdx + 1) % MIRRORS.length; _executeSearch(); }
        }
    }

    function renderGrid(data) {
        const grid = document.getElementById('stationGrid');
        grid.innerHTML = '';
        if (!data || data.length === 0) {
            grid.innerHTML = '<div class="message-box">No stations found.</div>';
            return;
        }

        const frag = document.createDocumentFragment();
        data.forEach((s, index) => {
            stationMap.set(s.stationuuid, s);
            const isFav = favouriteSet.has(s.stationuuid);
            
            const div = document.createElement('div');
            div.className = 'station-card';
            div.style.animationDelay = `${(index % 20) * 0.04}s`;
            div.dataset.uuid = s.stationuuid;

            let qBadge = s.bitrate ? `<div class="badge">${s.bitrate} kbps</div>` : '';

            div.innerHTML = `
                <div class="fav-icon ${isFav ? 'is-saved' : ''}" data-uuid="${s.stationuuid}">❤</div>
                <img src="${s.favicon || 'https://cdn-icons-png.flaticon.com/512/565/565296.png'}" class="station-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/565/565296.png'" loading="lazy">
                <div class="station-name">${esc(s.name)}</div>
                <div class="station-tags">${esc(s.tags || 'Radio')}</div>
                ${qBadge}
            `;
            frag.appendChild(div);
        });
        grid.appendChild(frag);
    }

    function initTrueVisualizer() {
        if (isAudioCtxSetup) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        bassNode = audioCtx.createBiquadFilter(); bassNode.type = 'lowshelf'; bassNode.frequency.value = 250;
        midNode = audioCtx.createBiquadFilter(); midNode.type = 'peaking'; midNode.frequency.value = 1000; midNode.Q.value = 1;
        trebleNode = audioCtx.createBiquadFilter(); trebleNode.type = 'highshelf'; trebleNode.frequency.value = 6000;

        const source = audioCtx.createMediaElementSource(audioCORS);
        source.connect(bassNode);
        bassNode.connect(midNode);
        midNode.connect(trebleNode);
        trebleNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        
        isAudioCtxSetup = true;
    }

    function toggleEQ() { document.getElementById('eqPanel').classList.toggle('active'); }
    function updateEQ() {
        if (!isAudioCtxSetup) return;
        bassNode.gain.value = document.getElementById('eqBass').value;
        midNode.gain.value = document.getElementById('eqMid').value;
        trebleNode.gain.value = document.getElementById('eqTreble').value;
    }

    function startVisualizer() { if (!vizRunning) { vizRunning = true; _vizLoop(); } }
    function stopVisualizer() { vizRunning = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }

    function _vizLoop() {
        if (!vizRunning) return;
        vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);
        if (!activeAudio.paused && !activeAudio.muted && activeAudio.volume > 0) {
            const bw = vizCanvas.width / numBars;
            if (useRealVisualizer && isAudioCtxSetup) {
                analyser.getByteFrequencyData(dataArray);
                for (let i=0; i<numBars; i++) {
                    const h = Math.max(1, (dataArray[i]/255) * vizCanvas.height);
                    vizCtx.fillStyle = '#2ecc71'; vizCtx.fillRect(i*bw, vizCanvas.height-h, bw-1, h);
                }
            } else {
                time += 0.15;
                for (let i=0; i<numBars; i++) {
                    const h = Math.max(1, Math.abs(Math.sin(time+i*0.5)*Math.cos(time*0.8-i*0.2)) * vizCanvas.height * (1-(i/numBars)*0.5) * activeAudio.volume);
                    vizCtx.fillStyle = '#2ecc71'; vizCtx.fillRect(i*bw, vizCanvas.height-h, bw-1, h);
                }
            }
        }
        rafId = requestAnimationFrame(_vizLoop);
    }

    async function playFromHash(uuid) {
        try {
            const resp = await fetch(`${MIRRORS[mirrorIdx]}/stations/byuuid/${uuid}`);
            const data = await resp.json();
            if (data && data.length > 0) playStation(data[0]);
        } catch (e) { startSearch(); }
    }

    function playStation(s) {
        currentStation = s;
        document.getElementById('pName').textContent = s.name;
        document.getElementById('pStatus').innerHTML = '<span class="connecting-spinner"></span>Connecting...';
        
        const bBadge = document.getElementById('bitrateBadge');
        if (s.bitrate && s.bitrate > 0) { bBadge.style.display = 'inline-block'; bBadge.textContent = `${s.bitrate} kbps`; } 
        else { bBadge.style.display = 'none'; }

        addToHistory(s);
        
        window.history.replaceState(null, null, `#${s.stationuuid}`);

        if (currentHls) { currentHls.destroy(); currentHls = null; }
        audioCORS.pause(); audioCORS.src = '';
        audioFallback.pause(); audioFallback.src = '';
        vizCanvas.classList.remove('active');

        let url = s.url_resolved || s.url || '';
        if (window.location.protocol === 'https:' && url.startsWith('http:')) url = url.replace('http:', 'https:');

        attemptStream(url, true);
    }

    function attemptStream(url, corsAttempted) {
        activeAudio = corsAttempted ? audioCORS : audioFallback;
        useRealVisualizer = corsAttempted;

        const onErr = () => {
            if (corsAttempted) attemptStream(url, false);
            else document.getElementById('pStatus').innerHTML = '<span style="color:var(--accent-red)">Offline / Error</span>';
        };

        if (Hls.isSupported() && url.includes('.m3u8')) {
            currentHls = new Hls();
            currentHls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) onErr(); });
            currentHls.loadSource(url); currentHls.attachMedia(activeAudio);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => activeAudio.play().catch(()=>{}));
        } else {
            activeAudio.src = url; activeAudio.load();
            activeAudio.addEventListener('error', onErr, {once: true});
            activeAudio.play().catch(onErr);
        }
    }

    function setupAudioListeners() {
        [audioCORS, audioFallback].forEach(el => {
            el.addEventListener('playing', () => {
                if (el === audioCORS) {
                    if (!isAudioCtxSetup) initTrueVisualizer();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                }
                document.getElementById('pStatus').innerHTML = '<span class="live-dot"></span>Live';
                document.getElementById('pStatus').style.color = 'var(--accent-green)';
                vizCanvas.classList.add('active');
            });
            el.addEventListener('pause', () => { document.getElementById('pStatus').textContent = 'Paused'; });
        });
    }

    function shareStation() {
        if (!currentStation) return alert("Select a station to share first!");
        const url = window.location.origin + window.location.pathname + '#' + currentStation.stationuuid;
        if (navigator.share) {
            navigator.share({ title: `Listen to ${currentStation.name}`, url: url }).catch(()=>{});
        } else {
            navigator.clipboard.writeText(url);
            alert("Station link copied to clipboard!");
        }
    }

    function checkCastSupport() {
        const btn = document.getElementById('castBtn');
        if (!window.RemotePlayback && !document.createElement('video').webkitShowPlaybackTargetPicker) {
            btn.style.display = 'none';
        }
    }

    function requestCast() {
        if (!activeAudio) return;
        if (activeAudio.remote && activeAudio.remote.prompt) {
            activeAudio.remote.prompt().catch(e => console.log("Cast prompt failed", e));
        } else if (activeAudio.webkitShowPlaybackTargetPicker) {
            activeAudio.webkitShowPlaybackTargetPicker();
        } else {
            alert("Casting is not supported on this browser.");
        }
    }

    function setSleepTimer(minutes) {
        clearTimeout(sleepTimerTimeout);
        if (minutes == "0") return;
        alert(`Sleep timer set for ${minutes} minutes.`);
        sleepTimerTimeout = setTimeout(() => {
            if (activeAudio) activeAudio.pause();
            document.getElementById('sleepTimer').value = "0";
        }, parseInt(minutes) * 60000);
    }

    function restoreVolume() {
        const v = parseFloat(storage.get('radio_volume') ?? '1');
        audioCORS.volume = audioFallback.volume = document.getElementById('volSlider').value = isNaN(v)?1:v;
    }
    function toggleMute() { audioCORS.muted = audioFallback.muted = !audioCORS.muted; }
    function changeVolume(v) {
        audioCORS.volume = audioFallback.volume = v;
        if (v>0) audioCORS.muted = audioFallback.muted = false;
        storage.set('radio_volume', v);
    }

    function setupKeyboardNav() { /* Keep existing logic */ }
    function openWheel() { /* Keep existing logic */ }
    function closeWheel() { /* Keep existing logic */ }
    function spinWheel() { /* Keep existing logic */ }
